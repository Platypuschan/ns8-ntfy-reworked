name: "Build API JSON Schema docs"

on:
  push:
    paths:
      - '**/validate-input.json'
      - '**/validate-output.json'
      - '**/validator-definitions.json'

# The reusable workflow pushes the docs to the apidoc-<branch> branch; the
# repository token defaults to read-only, so grant write access explicitly.
permissions:
  contents: write

jobs:
  build-apidoc:
    uses: NethServer/ns8-github-actions/.github/workflows/build-apidoc.yml@v1
